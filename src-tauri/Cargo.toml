[package]
name = "nodefable"
version = "0.1.0"
description = "NodeFable — interactive fiction editor (Tauri v2 desktop & Android)"
edition = "2021"
rust-version = "1.80"

[lib]
# staticlib/cdylib are required for the Android (and iOS) builds.
name = "nodefable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
percent-encoding = "2"
mime_guess = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
