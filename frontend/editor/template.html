<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Game</title>
<link rel="stylesheet" href="template_styles.css">
</head>
<body>
<div id="app">
    <aside id="side-panel">
        <div id="nav-row">
            <button id="nav-back" onclick="game.goBack()" disabled><svg viewBox="0 0 16 16" fill="currentColor" width="1em" height="1em"><path d="M8 10L8 14L6 14L-2.62268e-07 8L6 2L8 2L8 6L16 6L16 10L8 10Z"/></svg></button>
            <button id="nav-forward" onclick="game.goForward()" disabled><svg viewBox="0 0 16 16" fill="currentColor" width="1em" height="1em"><path d="M8 6L8 2L10 2L16 8L10 14L8 14L8 10L-1.74845e-07 10L-3.01991e-07 6L8 6Z"/></svg></button>
        </div>
        <div id="side-panel-content"></div>
        <button id="new-game-btn" onclick="game.newGame()">New Game</button>
        <button id="save-load-btn" onclick="game.showSaveLoad()">Save / Load</button>
    </aside>
    <main id="main-panel">
        <div id="main-scroll">
            <div id="passage-content"></div>
        </div>
    </main>

    <div id="save-load-overlay" style="display:none;">
        <div id="save-load-modal">
            <h3>Save / Load Game</h3>
            <div id="save-slots"></div>
            <button id="save-load-close" onclick="game.hideSaveLoad()">Close</button>
        </div>
    </div>
</div>

<script>
// __STORY_DATA_PLACEHOLDER__

const game = {
    state: {},
    currentNodeId: null,
    nodes: {},
    startNode: null,
    sidePanelNodeId: null,
    _freshEntry: false,
    _inInit: false,
    temp: {},

    init(data) {
        this.projectName = data.name;
        this.state = { ...data.variables };
        this.state._visited = {};
        this._originalVars = JSON.parse(JSON.stringify(data.variables));
        this._formCounters = { textfield: 0, checkbox: 0, radiogroup: 0, dropdown: 0, textarea: 0, number: 0 };
        this._history = [];
        this._historyIndex = -1;
        for (const n of data.nodes) {
            this.nodes[n.id] = n;
            if (n.id === 'side_panel') this.sidePanelNodeId = n.id;
        }

        const nodeIds = Object.keys(this.nodes);
        const mainNodeIds = nodeIds.filter(id => id !== 'side_panel');
        const explicitStart = mainNodeIds.find(id => this.nodes[id].is_start === true);
        this.startNode = explicitStart || (mainNodeIds.length > 0 ? mainNodeIds[0] : (nodeIds.length > 0 ? nodeIds[0] : null));

        document.getElementById('app').addEventListener('click', (e) => {
            let link = e.target.closest('a[data-node]');
            if (link) {
                e.preventDefault();
                if (!link.classList.contains('disabled')) this.navigateTo(link.dataset.node, parseInt(link.dataset.choiceIndex));
                return;
            }
            link = e.target.closest('a[data-action]');
            if (link) {
                e.preventDefault();
                if (!link.classList.contains('disabled')) this.applyAction(link.dataset.action);
            }
        });

        document.getElementById('save-load-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) this.hideSaveLoad();
        });

        // Form element event delegation
        document.getElementById('app').addEventListener('change', (e) => {
            const el = e.target;
            if (el.dataset.nfType === 'checkbox') {
                const varName = el.dataset.targetVar;
                const value = el.dataset.value;
                if (value) {
                    this.state[varName] = el.checked ? value : this._resetVar(varName);
                } else {
                    this.state[varName] = !!el.checked;
                }
                this._reRender();
            } else if (el.dataset.nfType === 'radio') {
                const varName = el.dataset.targetVar;
                const value = el.value;
                if (el.checked) {
                    this.state[varName] = value;
                    this._reRender();
                }
            } else if (el.dataset.nfType === 'dropdown') {
                this.state[el.dataset.targetVar] = el.value;
                this._reRender();
            }
        });

        document.getElementById('app').addEventListener('input', (e) => {
            const el = e.target;
            if ((el.dataset.nfType === 'textfield' || el.dataset.nfType === 'textarea') && el.dataset.commit === 'live') {
                this.state[el.dataset.targetVar] = el.value;
                this._reRender();
            }
            if (el.dataset.nfType === 'number') {
                if (el.value === '') return;
                this.state[el.dataset.targetVar] = el.valueAsNumber;
                this._reRender();
            }
        });

        document.getElementById('app').addEventListener('blur', (e) => {
            const el = e.target;
            if ((el.dataset.nfType === 'textfield' || el.dataset.nfType === 'textarea') && el.dataset.commit === 'blur') {
                this.state[el.dataset.targetVar] = el.value;
                this._reRender();
            }
        }, true);

        document.getElementById('app').addEventListener('keydown', (e) => {
            const el = e.target;
            if (el.dataset.nfType === 'textfield' && e.key === 'Enter') {
                const commit = el.dataset.commit;
                if (commit === 'onEnterKey' || !commit) {
                    this.state[el.dataset.targetVar] = el.value;
                    this._reRender();
                }
            }
        });

        if (this.loadGame()) { this.updateNavButtons(); return; }

        this.renderSidePanel();
        if (this.startNode) {
            this._history = [this.startNode];
            this._historyIndex = 0;
            this.render(this.startNode);
        } else {
            document.getElementById('passage-content').textContent = 'No story content.';
        }
        this.updateNavButtons();
    },

    navigateTo(slug, choiceIndex) {
        const node = this.currentNodeId ? this.nodes[this.currentNodeId] : null;
        const choices = this._activeChoices || (node ? (node.choices || []) : []);
        let choice;
        if (!isNaN(choiceIndex)) {
            choice = choices[choiceIndex];
        } else {
            choice = choices.find(c => c.target_node_id === slug);
        }

        if (choice && choice.prerequisite) {
            if (!this._evalBool(choice.prerequisite)) return;
        }
        const before = this.snapshotState();
        if (choice && choice.mutation) {
            this._evalMutation(choice.mutation, (msg) => this.notify(msg));
        }
        if (this.nodes[slug]) this.render(slug);
        if (this._historyIndex < this._history.length - 1) {
            this._history = this._history.slice(0, this._historyIndex + 1);
        }
        this._historyIndex++;
        this._history[this._historyIndex] = this.currentNodeId;
        this.detectChanges(before);
        this.updateNavButtons();
        this.autoSave();
    },

    applyAction(actionId) {
        let action = (this._activeActions || []).find(a => a.id === actionId);
        if (!action && this.sidePanelNodeId) {
            const sideNode = this.nodes[this.sidePanelNodeId];
            action = ((this._sidePanelActiveActions || sideNode.actions || [])).find(a => a.id === actionId);
        }
        if (!action) return;

        const before = this.snapshotState();
        for (const pair of action.pairs || []) {
            let met = true;
            if (pair.condition) {
                met = this._evalBool(pair.condition);
            }
            if (met) {
                this._evalMutation(pair.mutation, (msg) => this.notify(msg));
            }
        }
        //this.detectChanges(before);
        if (this.currentNodeId) this.render(this.currentNodeId);
        this.autoSave();
    },

    renderSidePanel() {
        const el = document.getElementById('side-panel-content');
        if (this.sidePanelNodeId && this.nodes[this.sidePanelNodeId]) {
            const sideNode = this.nodes[this.sidePanelNodeId];
            const text = this._preprocessText(sideNode.text || '');
            const mergedChoices = (sideNode.choices || []).concat(this._includedChoices);
            const mergedActions = (sideNode.actions || []).concat(this._includedActions);
            this._sidePanelActiveActions = mergedActions;
            el.innerHTML = this.renderContent(text, mergedChoices, mergedActions);
        } else {
            el.innerHTML = '';
        }
    },

    notify(message) {
        let toast = document.getElementById('game-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'game-toast';
            document.getElementById('app').appendChild(toast);
        }
        toast.textContent = message;
        toast.style.display = 'block';
        toast.style.opacity = '1';
        clearTimeout(this._notifyTimer);
        this._notifyTimer = setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => { toast.style.display = 'none'; }, 300);
        }, 2500);
    },

    snapshotState() {
        const snap = {};
        for (const [key, val] of Object.entries(this.state)) {
            if (typeof val === 'number' && key !== 'day') snap[key] = val;
        }
        return snap;
    },

    detectChanges(before) {
        for (const [key, val] of Object.entries(this.state)) {
            if (typeof val === 'number' && before[key] !== undefined && before[key] !== val && key !== 'day') {
                const diff = val - before[key];
                if (diff > 0) this.notify(this.formatKey(key) + ' +' + diff);
                else if (diff < 0) this.notify(this.formatKey(key) + ' ' + diff);
            }
        }
    },

    formatKey(key) {
        return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    },

    autoSave() {
        if (!this.projectName) return;
        this._saveToStorage('storyeditor_autosave');
        try {
            localStorage.setItem('storyeditor_save', localStorage.getItem('storyeditor_autosave'));
        } catch {}
    },

    _saveToStorage(key) {
        try {
            const save = {
                projectName: this.projectName,
                state: this.state,
                currentNodeId: this.currentNodeId,
                _history: this._history,
                _historyIndex: this._historyIndex,
                timestamp: Date.now()
            };
            localStorage.setItem(key, JSON.stringify(save));
        } catch (e) {
            console.warn('Save failed:', e);
        }
    },

    _loadFromStorage(key) {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return null;
            const save = JSON.parse(raw);
            if (save.projectName !== this.projectName) return null;
            return save;
        } catch {
            return null;
        }
    },

    loadGame() {
        let save = this._loadFromStorage('storyeditor_autosave');
        if (!save) save = this._loadFromStorage('storyeditor_save');
        if (!save) return false;
        if (!save.state || !save.currentNodeId) return false;
        this.state = save.state;
        this.temp = {};
        // Merge missing original variables (new vars added since the save was created)
        for (const [key, defaultVal] of Object.entries(this._originalVars || {})) {
            if (!(key in this.state)) {
                this.state[key] = defaultVal;
            }
        }
        if (!this.state._visited) this.state._visited = {};
        this._history = save._history || [save.currentNodeId];
        this._historyIndex = save._historyIndex !== undefined ? save._historyIndex : 0;
        this.renderSidePanel();
        this.currentNodeId = save.currentNodeId;
        if (this.nodes[save.currentNodeId]) {
            this.render(save.currentNodeId);
        } else if (this.startNode) {
            this._history = [this.startNode];
            this._historyIndex = 0;
            this.render(this.startNode);
        } else {
            return false;
        }
        this.notify('Game restored from save.');
        return true;
    },

    newGame() {
        try {
            const keys = ['storyeditor_save', 'storyeditor_autosave'];
            for (let i = 1; i <= 5; i++) keys.push('storyeditor_save_' + i);
            keys.forEach(k => { try { localStorage.removeItem(k); } catch {} });
        } catch {}
        window.location.reload();
    },

    showSaveLoad() {
        this.renderSaveSlots();
        document.getElementById('save-load-overlay').style.display = 'flex';
    },

    hideSaveLoad() {
        document.getElementById('save-load-overlay').style.display = 'none';
    },

    renderSaveSlots() {
        const container = document.getElementById('save-slots');
        const slotNames = ['Auto-save', 'Slot 1', 'Slot 2', 'Slot 3', 'Slot 4', 'Slot 5'];
        const storageKeys = ['storyeditor_autosave', 'storyeditor_save_1', 'storyeditor_save_2', 'storyeditor_save_3', 'storyeditor_save_4', 'storyeditor_save_5'];

        let html = '';
        for (let i = 0; i < 6; i++) {
            const save = this._loadFromStorage(storageKeys[i]);
            const isOccupied = save !== null;
            const isAuto = i === 0;
            const nodeTitle = isOccupied && this.nodes[save.currentNodeId]
                ? this.nodes[save.currentNodeId].title || save.currentNodeId
                : null;

            html += '<div class="save-slot">';
            html += '  <div class="save-slot-info">';
            html += '    <div class="save-slot-label">' + slotNames[i] + '</div>';
            if (isOccupied) {
                html += '    <div class="save-slot-title">' + nodeTitle + '</div>';
                html += '    <div class="save-slot-time">' + this._formatTime(save.timestamp) + '</div>';
            } else {
                html += '    <div class="save-slot-empty">Empty</div>';
            }
            html += '  </div>';
            html += '  <div class="save-slot-actions">';
            html += '    <button class="save-slot-load" onclick="game.loadFromSlot(' + i + ')">Load</button>';
            if (isOccupied && !isAuto) {
                html += '    <button class="save-slot-delete" onclick="game.deleteSlot(' + i + ')">Delete</button>';
            }
            if (isAuto) {
                html += '    <button class="save-slot-save" onclick="game.saveToSlot(' + i + ')">Save</button>';
            } else {
                html += '    <button class="save-slot-save" onclick="game.saveToSlot(' + i + ')">' + (isOccupied ? 'Overwrite' : 'Save') + '</button>';
            }
            html += '  </div>';
            html += '</div>';
        }
        container.innerHTML = html;
    },

    _resetVar(varName) {
        const current = this.state[varName];
        if (typeof current === 'boolean') return false;
        if (typeof current === 'number') return 0;
        return '';
    },

    _formatTime(ts) {
        const d = new Date(ts);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
    },

    saveToSlot(index) {
        if (!this.currentNodeId) { this.notify('No game in progress to save.'); return; }
        const keys = ['storyeditor_autosave', 'storyeditor_save_1', 'storyeditor_save_2', 'storyeditor_save_3', 'storyeditor_save_4', 'storyeditor_save_5'];
        this._saveToStorage(keys[index]);
        if (index === 0) {
            try { localStorage.setItem('storyeditor_save', localStorage.getItem('storyeditor_autosave')); } catch {}
        }
        this.renderSaveSlots();
        this.notify('Game saved to ' + (index === 0 ? 'Auto-save' : 'Slot ' + index) + '.');
    },

    loadFromSlot(index) {
        const keys = ['storyeditor_autosave', 'storyeditor_save_1', 'storyeditor_save_2', 'storyeditor_save_3', 'storyeditor_save_4', 'storyeditor_save_5'];
        const save = this._loadFromStorage(keys[index]);
        if (!save) { this.notify('Slot is empty.'); return; }
        this.state = save.state;
        this.temp = {};
        // Merge missing original variables (new vars added since the save was created)
        for (const [key, defaultVal] of Object.entries(this._originalVars || {})) {
            if (!(key in this.state)) {
                this.state[key] = defaultVal;
            }
        }
        if (!this.state._visited) this.state._visited = {};
        this._history = save._history || [save.currentNodeId];
        this._historyIndex = save._historyIndex !== undefined ? save._historyIndex : 0;
        this.hideSaveLoad();
        if (this.nodes[save.currentNodeId]) {
            this.render(save.currentNodeId);
        } else if (this.startNode) {
            this._history = [this.startNode];
            this._historyIndex = 0;
            this.render(this.startNode);
        } else {
            return;
        }
        this.updateNavButtons();
        this.notify('Game loaded from ' + (index === 0 ? 'Auto-save' : 'Slot ' + index) + '.');
    },

    deleteSlot(index) {
        if (index === 0) return;
        const keys = ['', 'storyeditor_save_1', 'storyeditor_save_2', 'storyeditor_save_3', 'storyeditor_save_4', 'storyeditor_save_5'];
        try {
            localStorage.removeItem(keys[index]);
        } catch {}
        this.renderSaveSlots();
        this.notify('Slot ' + index + ' deleted.');
    },

    goBack() {
        if (this._historyIndex <= 0) return;
        this._historyIndex--;
        const slug = this._history[this._historyIndex];
        if (this.nodes[slug]) {
            this.render(slug);
            if (this.currentNodeId !== slug) {
                this._history[this._historyIndex] = this.currentNodeId;
            }
        }
        this.updateNavButtons();
    },

    goForward() {
        if (this._historyIndex >= this._history.length - 1) return;
        this._historyIndex++;
        const slug = this._history[this._historyIndex];
        if (this.nodes[slug]) {
            this.render(slug);
            if (this.currentNodeId !== slug) {
                this._history[this._historyIndex] = this.currentNodeId;
            }
        }
        this.updateNavButtons();
    },

    updateNavButtons() {
        const backBtn = document.getElementById('nav-back');
        const forwardBtn = document.getElementById('nav-forward');
        if (backBtn) backBtn.disabled = this._historyIndex <= 0;
        if (forwardBtn) forwardBtn.disabled = this._historyIndex >= this._history.length - 1;
    },

    processDirectives(text) {
        this._varValues = [];
        this._includeCount = 0;
        this._includeLimitNotified = false;
        this._includedChoices = [];
        this._includedActions = [];
        return this._processDirectives(text, false).text;
    },

    _processDirectives(text, inLoop) {
        let out = '';
        let i = 0;
        const n = text.length;
        while (i < n) {
            if (text[i] !== '{') { out += text[i]; i++; continue; }
            const rest = text.slice(i);
            let m;
            if (rest.startsWith('{break}')) {
                if (inLoop) return { text: out, signal: 'break' };
                out += '{break}';
                i += 7;
                continue;
            }
            if (rest.startsWith('{continue}')) {
                if (inLoop) return { text: out, signal: 'continue' };
                out += '{continue}';
                i += 10;
                continue;
            }
            if ((m = rest.match(/^\{set:\s*([^}]+)\}/))) {
                this._evalMutation(m[1].trim(), (msg) => this.notify(msg));
                i += m[0].length;
                continue;
            }
            if ((m = rest.match(/^\{unset:\s*((?:state|temp)\.\w+|temp)\}/))) {
                const target = m[1].trim();
                if (target === 'temp') {
                    this.temp = {};
                } else if (target.startsWith('state.')) {
                    delete this.state[target.slice(6)];
                } else {
                    delete this.temp[target.slice(5)];
                }
                i += m[0].length;
                continue;
            }
            if ((m = rest.match(/^\{include:\s*([^}]+)\}/i))) {
                const slug = m[1].trim();
                const target = this.nodes[slug];
                i += m[0].length;
                if (!target) { out += m[0]; continue; }
                if (this._includeCount >= 100) {
                    if (!this._includeLimitNotified) { this.notify('Include limit exceeded.'); this._includeLimitNotified = true; }
                    continue;
                }
                this._includeCount++;
                if (!this._inInit) {
                    this._includedChoices.push(...(target.choices || []));
                    this._includedActions.push(...(target.actions || []));
                }
                const r = this._processDirectives(target.text || '', inLoop);
                out += r.text;
                if (r.signal) return { text: out, signal: r.signal };
                continue;
            }
            if ((m = rest.match(/^\{var:?\s*((?:state|temp)\.\w+(?:\[[^\]]+\])?(?:\.size)?)\}/))) {
                const val = this._evalValue(m[1]);
                if (val === undefined) {
                    out += m[0];
                } else {
                    const idx = this._varValues.length;
                    this._varValues.push(Array.isArray(val) ? val.join(', ') : String(val));
                    out += '\u0000nfvar_' + idx + '\u0000';
                }
                i += m[0].length;
                continue;
            }
            if (rest.startsWith('{for:')) {
                const block = this._findForEnd(text, i);
                if (block) {
                    out += this._runFor(block.init, block.condition, block.update, block.body);
                    i = block.end;
                    continue;
                }
            }
            if (rest.startsWith('{while:')) {
                const block = this._findWhileEnd(text, i);
                if (block) {
                    out += this._runWhile(block.body, block.condition);
                    i = block.end;
                    continue;
                }
            }
            if (rest.startsWith('{do}')) {
                const block = this._findDoWhileEnd(text, i);
                if (block) {
                    out += this._runDoWhile(block.body, block.condition);
                    i = block.end;
                    continue;
                }
            }
            if (rest.startsWith('{init}')) {
                const block = this._findInitEnd(text, i);
                if (block) {
                    if (this._freshEntry && !inLoop && !this._inInit) {
                        this._inInit = true;
                        try { this._processDirectives(block.body, false); } finally { this._inInit = false; }
                    }
                    i = block.end;
                    continue;
                }
            }
            if (rest.startsWith('{if:')) {
                const parsed = this._parseIfBranches(text, i);
                if (parsed) {
                    const selected = this._selectIfBranch(parsed, text);
                    if (selected !== null) {
                        const r = this._processDirectives(selected, inLoop);
                        out += r.text;
                        if (r.signal) return { text: out, signal: r.signal };
                    }
                    i = parsed.endIndex;
                    continue;
                }
            }
            out += text[i];
            i++;
        }
        return { text: out, signal: null };
    },

    _selectIfBranch(parsed, text) {
        const endifPos = parsed.endIndex - 7;
        let selected = null;
        for (let b = 0; b < parsed.branches.length; b++) {
            const branch = parsed.branches[b];
            if (branch.type === 'endif') break;
            let match = false;
            if (branch.type === 'else') {
                match = true;
            } else {
                match = this._evalBool(branch.condition);
            }
            if (match) {
                const nextTagStart = (b + 1 < parsed.branches.length) ? parsed.branches[b + 1].tagStart : endifPos;
                selected = text.slice(branch.tagEnd, nextTagStart);
                break;
            }
        }
        return selected;
    },

    _parseIfBranches(text, i) {
        const rest = text.slice(i);
        const m = rest.match(/^\{if:\s*([^}]*)\}/);
        if (!m) return null;
        let branches = [];
        branches.push({ type: 'if', condition: m[1].trim(), tagEnd: i + m[0].length });
        let depth = 1;
        let j = i + m[0].length;
        let endifPos = -1;
        const n = text.length;
        while (j < n && depth > 0) {
            if (text[j] === '{') {
                if (text.slice(j, j + 4) === '{if:') { depth++; j += 4; }
                else if (text.slice(j, j + 7) === '{endif}') {
                    depth--;
                    if (depth === 0) { endifPos = j; branches.push({ type: 'endif', tagStart: j }); }
                    j += 7;
                }
                else if (depth === 1) {
                    if (text.slice(j, j + 8) === '{elseif:') {
                        let eStart = j + 8;
                        if (text[eStart] === ' ') eStart++;
                        const eEnd = text.indexOf('}', eStart);
                        if (eEnd !== -1) {
                            branches.push({ type: 'elseif', condition: text.slice(eStart, eEnd).trim(), tagStart: j, tagEnd: eEnd + 1 });
                            j = eEnd + 1;
                            continue;
                        }
                    }
                    else if (text.slice(j, j + 6) === '{else}') {
                        branches.push({ type: 'else', tagStart: j, tagEnd: j + 6 });
                        j += 6;
                        continue;
                    }
                }
            }
            j++;
        }
        if (endifPos === -1) return null;
        return { branches, endIndex: endifPos + 7 };
    },

    _runWhile(body, condition) {
        let out = '';
        let guard = 0;
        while (this._evalBool(condition)) {
            if (++guard > 1000) { this.notify('Loop limit exceeded.'); break; }
            const r = this._processDirectives(body, true);
            out += r.text;
            if (r.signal === 'break') return out;
            if (r.signal === 'continue') continue;
        }
        return out;
    },

    _runDoWhile(body, condition) {
        let out = '';
        let guard = 0;
        do {
            if (++guard > 1000) { this.notify('Loop limit exceeded.'); break; }
            const r = this._processDirectives(body, true);
            out += r.text;
            if (r.signal === 'break') return out;
            if (r.signal === 'continue') continue;
        } while (this._evalBool(condition));
        return out;
    },

    _runFor(init, condition, update, body) {
        let out = '';
        let guard = 0;
        this._evalMutation(init, (msg) => this.notify(msg));
        while (this._evalBool(condition)) {
            if (++guard > 1000) { this.notify('Loop limit exceeded.'); break; }
            const r = this._processDirectives(body, true);
            out += r.text;
            if (r.signal === 'break') return out;
            this._evalMutation(update, (msg) => this.notify(msg));
            if (r.signal === 'continue') continue;
        }
        return out;
    },

    _findWhileEnd(text, i) {
        const m = text.slice(i).match(/^\{while:\s*([^}]+)\}/);
        if (!m) return null;
        const condition = m[1].trim();
        const bodyStart = i + m[0].length;
        let j = bodyStart;
        let depth = 0;
        const n = text.length;
        while (j < n) {
            if (text.slice(j).startsWith('{do}')) {
                const nb = this._findDoWhileEnd(text, j);
                if (!nb) return null;
                j = nb.end;
                continue;
            }
            if (text.slice(j).startsWith('{endwhile}')) {
                if (depth === 0) {
                    return { body: text.slice(bodyStart, j), condition, end: j + 10 };
                }
                depth--;
                j += 10;
                continue;
            }
            if (text.slice(j).startsWith('{while:')) {
                const tm = text.slice(j).match(/^\{while:[^}]*\}/);
                if (!tm) { j++; continue; }
                depth++;
                j += tm[0].length;
                continue;
            }
            j++;
        }
        return null;
    },

    _findDoWhileEnd(text, i) {
        const bodyStart = i + 4;
        let j = bodyStart;
        let depth = 0;
        const n = text.length;
        while (j < n) {
            if (text.slice(j).startsWith('{do}')) {
                const nb = this._findDoWhileEnd(text, j);
                if (!nb) return null;
                j = nb.end;
                continue;
            }
            if (text.slice(j).startsWith('{for:')) {
                const fb = this._findForEnd(text, j);
                if (!fb) { j++; continue; }
                j = fb.end;
                continue;
            }
            if (text.slice(j).startsWith('{endwhile}')) {
                if (depth === 0) return null;
                depth--;
                j += 10;
                continue;
            }
            if (text.slice(j).startsWith('{while:')) {
                const tm = text.slice(j).match(/^\{while:[^}]*\}/);
                if (!tm) { j++; continue; }
                if (depth === 0) {
                    const condition = tm[0].slice(7, -1).trim();
                    return { body: text.slice(bodyStart, j), condition, end: j + tm[0].length };
                }
                depth++;
                j += tm[0].length;
                continue;
            }
            j++;
        }
        return null;
    },

    _findInitEnd(text, i) {
        if (text.slice(i, i + 6) !== '{init}') return null;
        const bodyStart = i + 6;
        let j = bodyStart;
        let depth = 0;
        const n = text.length;
        while (j < n) {
            if (text.slice(j).startsWith('{init}')) { depth++; j += 6; continue; }
            if (text.slice(j).startsWith('{endinit}')) {
                if (depth === 0) return { body: text.slice(bodyStart, j), end: j + 9 };
                depth--;
                j += 9;
                continue;
            }
            j++;
        }
        return null;
    },

    _findForEnd(text, i) {
        const m = text.slice(i).match(/^\{for:\s*([^}]+)\}/);
        if (!m) return null;
        const parts = m[1].split(';').map(s => s.trim());
        if (parts.length < 3) return null;
        const bodyStart = i + m[0].length;
        let j = bodyStart;
        let depth = 0;
        const n = text.length;
        while (j < n) {
            if (text.slice(j).startsWith('{do}')) {
                const nb = this._findDoWhileEnd(text, j);
                if (!nb) return null;
                j = nb.end;
                continue;
            }
            if (text.slice(j).startsWith('{for:')) {
                const tm = text.slice(j).match(/^\{for:[^}]*\}/);
                if (!tm) { j++; continue; }
                depth++;
                j += tm[0].length;
                continue;
            }
            if (text.slice(j).startsWith('{endfor}')) {
                if (depth === 0) return { body: text.slice(bodyStart, j), init: parts[0], condition: parts[1], update: parts[2], end: j + 8 };
                depth--;
                j += 8;
                continue;
            }
            j++;
        }
        return null;
    },

    _norm(expr) {
        return (expr || '').replace(/((?:state|temp)\.\w+)\.size\b/g, '$1.length');
    },

    _evalBool(expr) {
        try {
            return !!new Function('state', 'temp', 'try { return ' + this._norm(expr) + '; } catch(e) { return false; }')(this.state, this.temp);
        } catch { return false; }
    },

    _evalMutation(expr, notify) {
        try { new Function('state', 'notify', 'temp', this._norm(expr))(this.state, notify, this.temp); }
        catch (e) { console.warn('Mutation failed:', e); }
    },

    _evalValue(expr) {
        try { return new Function('state', 'temp', 'return ' + this._norm(expr))(this.state, this.temp); }
        catch { return undefined; }
    },

    _preprocessText(text) {
        text = this.processDirectives(text);
        text = text.replace(/\{redirect:([^}]+)\}/g, '');
        return text;
    },

    _reRender() {
        if (!this.currentNodeId) return;
        const active = document.activeElement;
        const activeId = active ? active.id : null;
        const selStart = active && active.selectionStart !== undefined ? active.selectionStart : null;
        const selEnd = active && active.selectionEnd !== undefined ? active.selectionEnd : null;
        this.render(this.currentNodeId);
        if (activeId) {
            const restored = document.getElementById(activeId);
            if (restored) {
                restored.focus();
                if (selStart !== null && selEnd !== null) {
                    restored.selectionStart = selStart;
                    restored.selectionEnd = selEnd;
                }
            }
        }
    },

    render(nodeId) {
        this._formCounters = { textfield: 0, checkbox: 0, radiogroup: 0, dropdown: 0, textarea: 0, number: 0 };
        const node = this.nodes[nodeId];
        if (!node) return;
        this._waitTimeouts?.forEach(t => clearTimeout(t));
        this._waitTimeouts = [];
        this._tailElements = null;

        this._freshEntry = nodeId !== this.currentNodeId || this.currentNodeId == null;
        if (this._freshEntry) this.temp = {};
        const resolved = this.processDirectives(node.text || '');
        const redirectSlug = this._checkRedirects(resolved);
        if (redirectSlug) {
            this.render(redirectSlug);
            return;
        }

        if (node.on_enter && node.on_enter.target_node_id) {
            let shouldRedirect = true;
            if (node.on_enter.condition) {
                shouldRedirect = this._evalBool(node.on_enter.condition);
            }
            if (shouldRedirect && this.nodes[node.on_enter.target_node_id]) {
                if (node.on_enter.mutation) {
                    this._evalMutation(node.on_enter.mutation);
                }
                this.render(node.on_enter.target_node_id);
                return;
            }
        }

        this.state._visited[nodeId] = true;
        this.currentNodeId = nodeId;
        let text = resolved.replace(/\{redirect:([^}]+)\}/g, '');
        const mergedChoices = (node.choices || []).concat(this._includedChoices);
        const mergedActions = (node.actions || []).concat(this._includedActions);
        this._activeChoices = mergedChoices;
        this._activeActions = mergedActions;
        document.getElementById('passage-content').innerHTML = this.renderContent(text, mergedChoices, mergedActions);
        this.renderSidePanel();
        this.runWaitSequences();
    },

    _parseMediaOptions(params) {
        const out = { target: '', w: '', h: '', alt: '', autoplay: true, repeat: true, mute: false };
        const parts = params.split(',');
        out.target = (parts.shift() || '').trim();
        parts.forEach(p => {
            const eqI = p.indexOf('=');
            const key = (eqI >= 0 ? p.slice(0, eqI) : p).trim().toLowerCase();
            const rawVal = eqI >= 0 ? p.slice(eqI + 1).trim() : '';
            if (key === 'w' && /^\d/.test(rawVal)) out.w = parseInt(rawVal, 10);
            else if (key === 'h' && /^\d/.test(rawVal)) out.h = parseInt(rawVal, 10);
            else if (key === 'alt') {
                if (rawVal !== '' && !rawVal.includes(',') && !rawVal.includes('}') && !rawVal.includes('"')) out.alt = rawVal;
            }
            else if (key === 'autoplay') out.autoplay = rawVal === '' || rawVal.toLowerCase() !== 'false';
            else if (key === 'repeat') out.repeat = rawVal === '' || rawVal.toLowerCase() !== 'false';
            else if (key === 'mute') out.mute = rawVal === '' || rawVal.toLowerCase() !== 'false';
        });
        return out;
    },

    renderContent(text, choices, actions) {
        choices = choices || [];
        actions = actions || [];
        text = text.replace(/\{random:(\d+)(?:,(\d+))?\}/g, (_, a, b) => {
            if (b === undefined) return String(Math.floor(Math.random() * (parseInt(a) + 1)));
            const lo = parseInt(a), hi = parseInt(b);
            return String(lo + Math.floor(Math.random() * (hi - lo + 1)));
        });
        let html = text
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        const legacyImages = [];
        html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)(?:\{img:[^}]*\})?/g, (m) => {
            legacyImages.push(m);
            return '\u0000nflegacy_' + (legacyImages.length - 1) + '\u0000';
        });

        // === Form Elements ===

        html = html.replace(/\{textfield:([^}]+)\}/g, (match, params) => {
            const parts = params.split(',').map(s => s.trim());
            const stateExpr = parts[0];
            const varName = stateExpr.replace(/^state\./, '');
            const hint = parts[1] || '';
            const commitMode = (parts[2] || 'onEnterKey').trim();
            const id = 'nf-textfield-' + (this._formCounters.textfield++);
            const initialValue = this.state[varName] !== undefined ? this.state[varName] : '';
            const escapedVal = String(initialValue).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const escapedHint = hint.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return '<input type="text" id="' + id + '" class="nf-textfield" value="' + escapedVal + '" placeholder="' + escapedHint + '" data-nf-type="textfield" data-target-var="' + varName + '" data-commit="' + commitMode + '">';
        });

        html = html.replace(/\{checkbox:([^}]+)\}/g, (match, params) => {
            const parts = params.split(',').map(s => s.trim());
            const stateExpr = parts[0];
            const varName = stateExpr.replace(/^state\./, '');
            const value = parts[1] ? parts[1].trim() : '';
            const checked = !!this.state[varName];
            const id = 'nf-checkbox-' + (this._formCounters.checkbox++);
            const escapedVal = value.replace(/"/g, '&quot;');
            return '<input type="checkbox" id="' + id + '" class="nf-checkbox"' + (checked ? ' checked' : '') + ' data-nf-type="checkbox" data-target-var="' + varName + '" data-value="' + escapedVal + '">';
        });

        html = html.replace(/\{radiogroup\}([\s\S]*?)\{endradiogroup\}/g, (match, body) => {
            const groupId = 'nf-rg-' + (this._formCounters.radiogroup++);
            const innerHtml = body.replace(/\{radiobutton:([^}]+)\}\s*/g, (rmatch, rparams) => {
                const parts = rparams.split(',').map(s => s.trim());
                const stateExpr = parts[0];
                const varName = stateExpr.replace(/^state\./, '');
                const value = parts[1] ? parts[1].trim() : '';
                const checked = String(this.state[varName]) === value;
                const escapedVal = value.replace(/"/g, '&quot;');
                return '<input type="radio" class="nf-radio" name="' + groupId + '" value="' + escapedVal + '"' + (checked ? ' checked' : '') + ' data-nf-type="radio" data-target-var="' + varName + '">';
            });
            return '<span class="nf-radiogroup">' + innerHtml + '</span>';
        });

        html = html.replace(/\{textarea:([^}]+)\}/g, (match, params) => {
            const parts = params.split(',').map(s => s.trim());
            const varName = parts[0].replace(/^state\./, '');
            const hint = parts[1] || '';
            const commitMode = (parts[2] || 'blur').trim();
            const rows = parts[3] || 3;
            const id = 'nf-textarea-' + (this._formCounters.textarea++);
            const value = this.state[varName] !== undefined ? this.state[varName] : '';
            const escapedVal = String(value).replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const escapedHint = hint.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return '<textarea id="' + id + '" class="nf-textarea" rows="' + rows + '" placeholder="' + escapedHint + '" data-nf-type="textarea" data-target-var="' + varName + '" data-commit="' + commitMode + '">' + escapedVal + '</textarea>';
        });

        html = html.replace(/\{number:([^}]+)\}/g, (match, params) => {
            const parts = params.split(',').map(s => s.trim());
            const varName = parts[0].replace(/^state\./, '');
            const min = parts[1] ? ' min="' + parts[1] + '"' : '';
            const max = parts[2] ? ' max="' + parts[2] + '"' : '';
            const step = parts[3] ? ' step="' + parts[3] + '"' : '';
            const id = 'nf-number-' + (this._formCounters.number++);
            const initial = this.state[varName] !== undefined ? this.state[varName] : '';
            return '<input type="number" id="' + id + '" class="nf-number"' + min + max + step + ' value="' + initial + '" data-nf-type="number" data-target-var="' + varName + '">';
        });

        html = html.replace(/\{dropdown:([^}]+)\}/g, (match, params) => {
            const parts = params.split(',').map(s => s.trim());
            const varName = parts[0].replace(/^state\./, '');
            const options = parts.slice(1);
            const id = 'nf-dropdown-' + (this._formCounters.dropdown++);
            const opts = options.map(o => {
                const v = o.replace(/"/g, '&quot;');
                const sel = String(this.state[varName]) === o ? ' selected' : '';
                return '<option value="' + v + '"' + sel + '>' + v + '</option>';
            }).join('');
            return '<select id="' + id + '" class="nf-dropdown" data-nf-type="dropdown" data-target-var="' + varName + '">' + opts + '</select>';
        });

        html = html.replace(/\{img:([^}]+)\}/g, (match, params) => {
            const o = this._parseMediaOptions(params);
            const alt = o.alt ? ' alt="' + o.alt.replace(/"/g, '&quot;') + '"' : '';
            return '<img src="' + o.target + '"' + alt + ' style="max-width:100%;height:auto'
                + (o.w ? ';width:' + o.w + 'px' : '')
                + (o.h ? ';height:' + o.h + 'px' : '')
                + '">';
        });

        html = html.replace(/\{video:([^}]+)\}/g, (match, params) => {
            const o = this._parseMediaOptions(params);
            const aria = o.alt ? ' aria-label="' + o.alt.replace(/"/g, '&quot;') + '"' : '';
            return '<video src="' + o.target + '" class="nf-video" controls preload="metadata"' + aria
                + ' style="max-width:100%;height:auto'
                + (o.w ? ';width:' + o.w + 'px' : '')
                + (o.h ? ';height:' + o.h + 'px' : '')
                + '"'
                + (o.autoplay ? ' autoplay' : '')
                + (o.repeat ? ' loop' : '')
                + (o.mute ? ' muted' : '')
                + '></video>';
        });

        const consumed = {};
        html = html.replace(/\[([^\]]*)\]\(node:([^)]+)\)/g, (match, text, slug) => {
            if (consumed[slug] === undefined) consumed[slug] = 0;
            const matchIndices = choices.reduce((acc, c, i) => {
                if (c.target_node_id === slug) acc.push(i);
                return acc;
            }, []);
            const choiceIdx = matchIndices[consumed[slug]] !== undefined ? matchIndices[consumed[slug]] : matchIndices[0];
            consumed[slug]++;
            const choice = choices[choiceIdx];
            let disabled = false;
            if (choice && choice.prerequisite) {
                try {
                    disabled = !new Function('state', 'temp', 'try { return ' + this._norm(choice.prerequisite) + '; } catch(e) { return false; }')(this.state, this.temp);
                } catch { disabled = true; }
            }
            const cls = disabled ? ' class="disabled"' : '';
            return '<a href="#" data-node="' + slug + '" data-choice-index="' + choiceIdx + '"' + cls + '>' + text + '</a>';
        });

        html = html.replace(/\[([^\]]*)\]\(action:([^)]+)\)/g, (match, text, actionId) => {
            const action = actions.find(a => a.id === actionId);
            let disabled = true;
            if (action && action.pairs && action.pairs.length > 0) {
                for (const pair of action.pairs) {
                    if (!pair.condition) { disabled = false; break; }
                    try {
                        if (new Function('state', 'temp', 'try { return ' + this._norm(pair.condition) + '; } catch(e) { return false; }')(this.state, this.temp)) {
                            disabled = false; break;
                        }
                    } catch {}
                }
            }
            const displayText = action ? action.text : text;
            const cls = disabled ? ' class="disabled"' : '';
            return '<a href="#" data-action="' + actionId + '"' + cls + '>' + displayText + '</a>';
        });

        html = html.replace(/\[([^\]]*)\]\([^)]+\)/g, '$1');

        html = html
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>');

        html = html
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h1>$1</h1>');

        html = html.replace(/\{wait:(\d+)(?:,\s*fade:(\d+))?\}([\s\S]*?)\{endwait\}/g, (match, duration, fade, inner) => {
            fade = fade || 500;
            const content = inner.trim().replace(/\n/g, '<br>');
            return '<div class="wait-sequence" data-duration="' + duration + '" data-fade="' + fade + '" style="opacity:0;transition:opacity ' + fade + 'ms ease">' + content + '</div>';
        });
        html = html
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');
        html = html.replace(/(<div class="wait-sequence"[^>]*>[\s\S]*?<\/div>)(?:\s*(?:<br\s*\/?>)?\s*<div class="wait-sequence"[^>]*>[\s\S]*?<\/div>)*/g, (match) => {
            const count = match.split('class="wait-sequence"').length - 1;
            if (count >= 2) return '<div class="wait-container">' + match + '</div>';
            return match;
        });
        html = html.replace(/\{dialogue:([^}]*)\}([\s\S]*?)\{enddialogue\}/g, (match, params, body) => {
            params = params.trim();
            let leftHtml = '';
            const imgMatch = params.match(/^(<img[^>]*>)/);
            if (imgMatch) {
                leftHtml += imgMatch[1].replace(
                    'style="max-width:100%;height:auto"',
                    'class="dialogue-avatar"'
                );
                const rest = params.slice(imgMatch[1].length).trim();
                if (rest.startsWith(',')) {
                    const name = rest.slice(1).trim();
                    if (name) leftHtml += '<div class="dialogue-name">' + name + '</div>';
                }
            } else if (params) {
                leftHtml += '<div class="dialogue-name">' + params + '</div>';
            }
            const bodyHtml = body.trim().replace(/\n/g, '<br>');
            return '<div class="dialogue-block">' +
                (leftHtml ? '<div class="dialogue-left">' + leftHtml + '</div>' : '') +
                '<div class="dialogue-text">' + bodyHtml + '</div>' +
            '</div>';
        });
        html = html.replace(/\u0000nflegacy_(\d+)\u0000/g, (_, n) => legacyImages[parseInt(n, 10)]);
        html = html.replace(/\u0000nfvar_(\d+)\u0000/g, (_, n) => {
            const val = this._varValues[parseInt(n, 10)];
            return val === undefined ? '' : String(val);
        });
            return '<p>' + html + '</p>';
    },

    _checkRedirects(text) {
        const m = text.match(/\{redirect:([^}]+)\}/);
        if (m && this.nodes[m[1].trim()]) return m[1].trim();
        return null;
    },

    runWaitSequences() {
        this._waitTimeouts?.forEach(t => clearTimeout(t));
        this._waitTimeouts = [];
        const content = document.getElementById('passage-content');
        const sequences = content.querySelectorAll('.wait-sequence');
        if (sequences.length === 0) { this._tailElements = null; return; }
        const lastSeq = sequences[sequences.length - 1];
        const lastFade = parseInt(lastSeq.dataset.fade, 10) || 500;
        const lastContainer = lastSeq.closest('.wait-container');
        const anchor = lastContainer || lastSeq;
        const tailElements = [];
        let next = anchor.nextElementSibling;
        while (next) {
            tailElements.push(next);
            next.style.opacity = '0';
            next = next.nextElementSibling;
        }
        this._tailElements = tailElements;
        let totalDelay = 0;
        sequences.forEach((seq, i) => {
            const duration = parseInt(seq.dataset.duration, 10);
            const fade = parseInt(seq.dataset.fade, 10);
            const isLast = i === sequences.length - 1;
            const t1 = setTimeout(() => {
                seq.style.opacity = '1';
                if (!isLast) {
                    const t2 = setTimeout(() => {
                        seq.style.opacity = '0';
                    }, duration);
                    this._waitTimeouts.push(t2);
                }
            }, totalDelay);
            this._waitTimeouts.push(t1);
            totalDelay += duration + (isLast ? 0 : fade * 2);
        });
        const tailT = setTimeout(() => {
            (this._tailElements || []).forEach(el => {
                el.style.transition = 'opacity ' + lastFade + 'ms ease';
                el.style.opacity = '1';
            });
            setTimeout(() => {
                (this._tailElements || []).forEach(el => el.style.transition = '');
                this._tailElements = null;
            }, lastFade + 50);
        }, totalDelay);
        this._waitTimeouts.push(tailT);
    }
};

if (typeof STORY_DATA !== 'undefined' && STORY_DATA && STORY_DATA.nodes) {
    game.init(STORY_DATA);
}
</script>
